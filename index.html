<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101214">
  <meta name="description" content="125 位英雄的原皮全息卡典藏。旋转、翻面，探索多层视差与光影。">
  <title>王者荣耀 · 原皮典藏 · 全息卡</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="viewer/styles.css">
  <script defer src="viewer/catalog.js"></script>
  <script defer src="viewer/renderer.js"></script>
  <script defer src="viewer/app.js"></script>
</head>
<body data-load-state="loading">
  <a class="skip-link" href="#search">查找英雄</a>
  <aside id="list" aria-label="英雄典藏">
    <header class="collection-heading">
      <span class="eyebrow">HONOR OF KINGS</span>
      <h1>原皮典藏<span class="brand-dot"> · </span>全息卡</h1>
      <p>每一面，都有新的光。</p>
    </header>
    <div class="catalog-tools">
      <div class="search-row">
        <label class="sr-only" for="search">搜索英雄、称号或编号</label>
        <input id="search" type="search" placeholder="搜索英雄、称号或编号" autocomplete="off" spellcheck="false">
        <button id="favorites-only" type="button" aria-pressed="false" title="只看收藏">收藏</button>
      </div>
      <p id="result-count" aria-live="polite">正在读取典藏…</p>
    </div>
    <div class="grid" id="grid" aria-label="选择英雄"></div>
    <div id="empty" class="empty" hidden>
      <p id="empty-message">没有找到匹配的英雄。</p>
      <button id="clear-filters" type="button">查看全部英雄</button>
    </div>
    <footer class="collection-footer">个人存档与技术演示 · 角色及素材版权归腾讯所有</footer>
  </aside>
  <main aria-label="全息卡展示">
    <header class="stage-heading">
      <div class="hero-heading">
        <span class="eyebrow">HOLOGRAPHIC COLLECTION</span>
        <h2 id="tname">原皮典藏</h2>
        <p id="tmeta">正在准备卡片…</p>
      </div>
      <div class="stage-actions">
        <button id="favorite" class="icon-button" type="button" aria-label="收藏当前英雄" aria-pressed="false" title="收藏当前英雄">☆</button>
        <button id="share" class="icon-button" type="button" aria-label="复制当前卡片链接" title="复制当前卡片链接">↗</button>
      </div>
    </header>
    <section id="stage" class="stage" aria-label="可旋转的全息卡" aria-busy="true">
      <div class="room" aria-hidden="true"></div>
      <button id="prev" class="step-button previous" type="button" aria-label="上一位英雄">‹</button>
      <div class="card" id="card" role="button" tabindex="0" aria-label="拖动旋转卡片，点击或按回车翻面">
        <div class="face front">
          <canvas id="cv" aria-label="英雄全息卡面"></canvas>
          <img id="preview" class="preview" alt="卡面预览" draggable="false">
        </div>
        <div class="face back"><img src="shared/back.webp" alt="全息卡背面" draggable="false"></div>
      </div>
      <button id="next" class="step-button next" type="button" aria-label="下一位英雄">›</button>
      <p class="gesture-hint">拖动旋转 <span>·</span> 点击翻面 <span>·</span> ← → 切换英雄</p>
    </section>
    <div class="bottom-panel">
      <div class="status-row">
        <p id="status" role="status" aria-live="polite">正在读取英雄目录…</p>
        <button id="retry" type="button" hidden>重新加载</button>
      </div>
      <div class="controls" id="controls">
        <div class="range-control">
          <label for="depth">景深</label>
          <input id="depth" type="range" min="-3" max="3" step="0.05" value="0">
          <output id="odepth" for="depth">0.00×</output>
        </div>
        <div class="range-control">
          <label for="glow">轮廓光</label>
          <input id="glow" type="range" min="0" max="3" step="0.05" value="0.15">
          <output id="oglow" for="glow">0.15×</output>
        </div>
        <div class="control-actions">
          <button id="flip" type="button">翻转卡片</button>
          <button id="recenter" type="button">回正视角</button>
          <label class="quality-label"><span class="sr-only">渲染画质</span>
            <select id="quality" aria-label="渲染画质">
              <option value="auto">画质 · 自动</option>
              <option value="low">画质 · 流畅</option>
              <option value="high">画质 · 高清</option>
            </select>
          </label>
        </div>
      </div>
      <label id="share-fallback" class="share-fallback" hidden>复制这个链接即可分享卡片
        <input id="share-link" type="text" readonly aria-label="当前卡片分享链接">
      </label>
    </div>
  </main>
  <noscript>请启用 JavaScript 后浏览全息卡片。角色与素材版权归腾讯《王者荣耀》所有。</noscript>
</body>
</html>

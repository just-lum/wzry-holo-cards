<style>
:root{--bg:#0f1013;--panel:#17191d;--line:#ffffff1a;--ink:#dfe6ee;--accent:#d6ef9d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
body{display:grid;grid-template-columns:298px 1fr}
#list{overflow-y:auto;border-right:1px solid var(--line);background:var(--panel)}
#list h1{font-size:13px;margin:0;padding:13px 16px;border-bottom:1px solid var(--line);
  font-weight:600;letter-spacing:.08em;position:sticky;top:0;background:var(--panel);z-index:2}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px}
.item{cursor:pointer;border:1px solid transparent;border-radius:7px;overflow:hidden;
  background:#1e2126;text-align:center;padding-bottom:4px}
.item:hover{border-color:#ffffff2e}
.item.sel{border-color:var(--accent);background:#232a22}
.item img{width:100%;display:block;aspect-ratio:5/7;object-fit:cover;object-position:top}
.item b{display:block;font-size:11px;font-weight:500;margin-top:3px}
.item span{display:block;font-size:9px;opacity:.55;margin-top:1px}
main{position:relative;display:grid;place-items:center;overflow:hidden}
.room{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#25282b,#101113 80%)}
.stage{position:relative;width:100%;height:100%;display:grid;place-items:center;perspective:1400px}
.card{position:relative;width:min(66vw,430px,calc(70vh / 1.486));aspect-ratio:1 / 1.486;
  transform-style:preserve-3d;cursor:grab;touch-action:none;user-select:none;
  transform:rotateX(-5deg) rotateY(-12deg)}
.card:active{cursor:grabbing}
.face{position:absolute;inset:0;border-radius:4.5%/3.2%;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;box-shadow:0 0 0 1px #202329,0 30px 65px #000b}
.front{overflow:visible;background:transparent}
.front canvas{position:absolute;width:160%;height:160%;left:-30%;top:-30%;
  border-radius:0;pointer-events:none}
.back{visibility:hidden;transform:rotateY(180deg);background:#13216a;overflow:hidden}
.back img{width:100%;height:100%;object-fit:fill;display:block}
.hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.hud b{font-size:19px;letter-spacing:.22em;text-shadow:0 2px 12px #000a}
.hud span{display:block;font-size:11px;opacity:.62;margin-top:3px;letter-spacing:.1em}
.controls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  width:min(430px,92vw);display:grid;grid-template-columns:auto 1fr 56px;gap:10px;
  align-items:center;padding:13px 16px;background:#1b1e22ee;border:1px solid var(--line);
  border-radius:14px;font-size:12px}
.controls input[type=range]{width:100%;accent-color:var(--accent)}
.controls output{text-align:right;font-variant-numeric:tabular-nums}
.controls .row{grid-column:1/-1;display:flex;gap:8px;margin-top:2px}
.controls button{flex:1;min-height:32px;border:1px solid #ffffff25;border-radius:8px;
  background:#2b3036;color:inherit;font:inherit;cursor:pointer}
.controls button:hover{background:#343a42}
#status{position:absolute;bottom:104px;left:50%;transform:translateX(-50%);
  font-size:12px;opacity:.72;pointer-events:none;text-shadow:0 1px 6px #000}
@media(max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:168px 1fr}
  #list{border-right:0;border-bottom:1px solid var(--line)}
  .grid{grid-template-columns:repeat(6,1fr)}
  .card{width:min(84vw,calc(62vh / 1.486))}
}
</style>

, "name": "赵怀真", "title": "自在之心", "edition": "No. 113 / 130"}, {"no": 114, "key": "545_莱西奥", "name": "莱西奥", "title": "火鹰船长", "edition": "No. 114 / 130"}, {"no": 115, "key": "564_姬小满", "name": "姬小满", "title": "武道奇才", "edition": "No. 115 / 130"}, {"no": 116, "key": "514_亚连", "name": "亚连", "title": "追忆之刃", "edition": "No. 116 / 130"}, {"no": 117, "key": "563_海诺", "name": "海诺", "title": "命运之引", "edition": "No. 117 / 130"}, {"no": 118, "key": "519_敖隐", "name": "敖隐", "title": "凌霄真龙", "edition": "No. 118 / 130"}, {"no": 119, "key": "517_大司命", "name": "大司命", "title": "肃归之戈", "edition": "No. 119 / 130"}, {"no": 122, "key": "577_少司缘", "name": "少司缘", "title": "聆愿之祝", "edition": "No. 122 / 130"}, {"no": 123, "key": "558_影", "name": "影", "title": "黯羽东君", "edition": "No. 123 / 130"}, {"no": 124, "key": "177_苍", "name": "苍", "title": "苍狼末裔", "edition": "No. 124 / 130"}, {"no": 125, "key": "550_空空儿", "name": "空空儿", "title": "笑面诡手", "edition": "No. 125 / 130"}, {"no": 127, "key": "151_孙权", "name": "孙权", "title": "定旌之谋", "edition": "No. 127 / 130"}, {"no": 128, "key": "172_蚩奼", "name": "蚩奼", "title": "五兵之主", "edition": "No. 128 / 130"}];
  // heroes.json 已内联：file:// 下 fetch 会被 CORS 拦掉，页面会只剩空网格

  heroes.forEach(h => {
    const el = document.createElement('div');
    el.className = 'item';
    el.dataset.key = h.key;
    el.innerHTML = '<img loading="lazy" src="viewer/thumb/' + h.key + '.webp' + V +
                   '" alt=""><b>' + h.name + '</b><span>' + (h.title || '') + '</span>';
    el.onclick = () => select(h, el);
    grid.appendChild(el);
  });

  let renderer = null, dirty = true, seq = 0;
  let mx = -5, my = -12, tx = -5, ty = -12, base = 0;
  let down = false, ptr = null, px = 0, py = 0, sx = 0, sy = 0, moved = false;
  let depth = 0, glow = 0.15, reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  async function select(h, el) {
    document.querySelectorAll('.item.sel').forEach(e => e.classList.remove('sel'));
    el.classList.add('sel');
    tname.textContent = h.name;
    tmeta.textContent = (h.title ? h.title + ' · ' : '') + h.edition;
    status.textContent = '加载中 …';
    const mySeq = ++seq;
    const assets = {
      character: 'layers/' + h.key + '/character.webp' + V,
      background: 'shared/background.webp' + V,
      ui: 'layers/' + h.key + '/ui.webp' + V,
      structure: 'layers/' + h.key + '/structure.webp' + V,
    };
    try {
      // 每张卡换一个新 canvas：旧 WebGL 上下文随之释放，避免切 130 张后资源堆积
      const old = front.querySelector('canvas');
      const nc = document.createElement('canvas');
      nc.id = 'cv';
      front.replaceChild(nc, old);
      const r = await createCardRenderer(nc, assets);
      if (mySeq !== seq) return;          // 期间又切了别的英雄，丢弃
      renderer = r;
      dirty = true;
      status.textContent = '';
    } catch (e) {
      status.textContent = '加载失败：' + e.message;
    }
  }

  card.addEventListener('pointerdown', e => {
    if (ptr !== null) return;
    ptr = e.pointerId; down = true; moved = false;
    px = sx = e.clientX; py = sy = e.clientY;
    try { card.setPointerCapture(e.pointerId); } catch (_) {}
  });
  card.addEventListener('pointermove', e => {
    if (!down || ptr !== e.pointerId) return;
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > 5) moved = true;
    ty += (e.clientX - px) * 0.62;
    tx = Math.max(-50, Math.min(50, tx - (e.clientY - py) * 0.3));
    px = e.clientX; py = e.clientY;
  });
  const end = e => {
    if (ptr !== e.pointerId) return;
    ptr = null; down = false;
    if (card.hasPointerCapture && card.hasPointerCapture(e.pointerId)) card.releasePointerCapture(e.pointerId);
    if (!moved) flip(); else base = Math.round(ty / 180) * 180;
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', e => { ptr = null; down = false; base = Math.round(ty / 180) * 180; });

  function flip() { ty = base + 180; base += 180; }
  document.getElementById('flip').onclick = () => flip();
  document.getElementById('recenter').onclick = () => { tx = -5; ty = base; };
  document.getElementById('depth').oninput = e => {
    depth = Number(e.target.value);
    document.getElementById('odepth').value = (depth > 0 ? '+' : '') + depth.toFixed(2) + '×';
    dirty = true;
  };
  document.getElementById('glow').oninput = e => {
    glow = Number(e.target.value);
    document.getElementById('oglow').value = glow.toFixed(2) + '×';
    dirty = true;
  };

  const ease = reduced ? 1 : 0.115;
  let lastX = 999, lastY = 999;
  function frame() {
    mx += (tx - mx) * ease;
    my += (ty - my) * ease;
    card.style.transform = 'rotateX(' + mx + 'deg) rotateY(' + my + 'deg)';
    const vis = Math.cos(my * Math.PI / 180) * Math.cos(mx * Math.PI / 180) > 0.001;
    front.style.visibility = vis ? 'visible' : 'hidden';
    back.style.visibility = vis ? 'hidden' : 'visible';
    // 旋转过程中必须持续重绘。漏掉这一条，画面就只在滑块变化时更新一次，
    // 拖拽时人物与背景看起来是死的（视差、彩虹高光、轮廓光全都不动）。
    if (renderer && vis && (dirty || Math.abs(mx - lastX) > 0.015 || Math.abs(my - lastY) > 0.015)) {
      renderer.draw(mx, my, 1, depth, glow);
      dirty = false;
      lastX = mx; lastY = my;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
